# LMRouter Web Console
name: lmrouter-web

# 服务配置
services:
  - type: web
    name: frontend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    ports:
      - port: 80
        type: HTTP
    env:
      # 构建时设置后端 API URL
      # 使用 localhost 因为 Nginx 会在同一容器内代理到后端
      - key: VITE_API_BASE_URL
        value: http://localhost
    # 健康检查
    healthCheck:
      http:
        path: /
        port: 80
    # 资源限制
    resources:
      cpu: 0.5
      memory: 512
