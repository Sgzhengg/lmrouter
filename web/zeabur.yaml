# LMRouter Web Console
name: lmrouter-web

# 服务配置
services:
  - type: web
    name: frontend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    ports:
      - port: 80
        type: HTTP
    env:
      # 后端 API 地址 - 部署后需要设置为实际的后端 URL
      # Zeabur 会自动替换 ${API_BASE_URL} 为实际的后端服务地址
      - key: VITE_API_BASE_URL
        value: ${API_BASE_URL}
    # 健康检查
    healthCheck:
      http:
        path: /
        port: 80
    # 资源限制
    resources:
      cpu: 0.5
      memory: 512
