# LMRouter Web Console
name: lmrouter-web

# 服务配置
services:
  - type: web
    name: frontend
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    ports:
      - port: 8080
        type: HTTP
    env:
      # 后端 API 地址 - Zeabur 会自动替换为实际的后端服务地址
      # 使用内部服务发现，避免硬编码 URL
      - key: BACKEND_URL
        value: ${BACKEND_URL:http://lmrouter-gires:3000}
    # 健康检查
    healthCheck:
      http:
        path: /
        port: 8080
    # 资源限制
    resources:
      cpu: 0.5
      memory: 512
