# LMRouter 生产环境配置文件
# 用于 Zeabur 等云平台部署

server:
  host: 0.0.0.0
  port: 3000
  logging: production

auth:
  enabled: false           # 生产环境建议启用认证
  better_auth:
    trusted_origins: []

responses_store:
  type: in_memory

access_keys:
  - sk-demo-key-12345      # 演示密钥，请在生产环境中替换

# ============================================
# 提供商配置
# ============================================
# 注意：生产环境需要配置真实的 API 密钥
# 可以通过环境变量设置，例如：
# OPENAI_API_KEY=sk-xxx ANTHROPIC_API_KEY=sk-ant-xxx

providers:
  # OpenAI 配置示例
  openai:
    type: openai
    base_url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api_key: ${OPENAI_API_KEY:}

  # Anthropic 配置示例
  anthropic:
    type: anthropic
    base_url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    api_key: ${ANTHROPIC_API_KEY:}

# ============================================
# 模型配置
# ============================================
models:
  # ---------- 国外模型 ----------
  # OpenAI 系列
  gpt-4-turbo:
    providers:
      - provider: openai
        model: gpt-4-turbo-preview

  gpt-3.5-turbo:
    providers:
      - provider: openai
        model: gpt-3.5-turbo

  dall-e-3:
    providers:
      - provider: openai
        model: dall-e-3

  # Anthropic (Claude) 系列
  claude-3-opus:
    providers:
      - provider: anthropic
        model: claude-3-opus-20240229

  claude-3-sonnet:
    providers:
      - provider: anthropic
        model: claude-3-sonnet-20240229

  # Google (Gemini) 系列
  gemini-2.0-flash:
    providers:
      - provider: openai
        model: gemini-2.0-flash-exp

  # DeepSeek 系列
  deepseek-chat:
    providers:
      - provider: openai
        model: deepseek-chat

  deepseek-coder:
    providers:
      - provider: openai
        model: deepseek-coder

  # Groq / Llama 系列
  llama-3.3-70b:
    providers:
      - provider: openai
        model: llama-3.3-70b-versatile

  mixtral-8x7b:
    providers:
      - provider: openai
        model: mixtral-8x7b-32768

  # ---------- 国内模型 ----------
  # 字节跳动 Doubao
  doubao-seed-2.0:
    providers:
      - provider: openai
        model: doubao-seed-2.0

  seedance-2.0:
    providers:
      - provider: openai
        model: seedance-2.0

  # 阿里巴巴 Qwen
  qwen3.5-plus:
    providers:
      - provider: openai
        model: qwen-plus

  qwen3-vl-embedding:
    providers:
      - provider: openai
        model: qwen-vl-plus

  # 月之暗面 Kimi
  kimi-k2.5:
    providers:
      - provider: openai
        model: moonshot-v1-auto

  # 商汤 SenseNova
  sensenova-mars:
    providers:
      - provider: openai
        model: nova-v1

  # 智谱 GLM
  glm-5:
    providers:
      - provider: openai
        model: glm-4-plus

  glm-ocr:
    providers:
      - provider: openai
        model: glm-4v-plus

  # 百度文心
  ernie-5.0:
    providers:
      - provider: openai
        model: ernie-4.0-8k

  paddleocr-vl-1.5:
    providers:
      - provider: openai
        model: ernie-vision

  # 腾讯混元
  hunyuan-image-3.0:
    providers:
      - provider: openai
        model: hunyuan-vision

  # MiniMax
  minimax-m2.5:
    providers:
      - provider: openai
        model: abab6.5s-chat

  music-2.5:
    providers:
      - provider: openai
        model: music-01

  # 阶跃星辰
  step-3.5-flash:
    providers:
      - provider: openai
        model: step-1v-32k

  # 科大讯飞星火
  spark-4.0-ultra:
    providers:
      - provider: openai
        model: spark-4.0-ultra

# 默认通配符路由：未匹配的模型统一走 openai
"*":
  providers:
    - provider: openai
      model: ""
