# Zeabur 部署配置
# 前端服务配置（部署 web 目录）
services:
  # 前端服务
  - type: web
    name: frontend
    runtime: docker
    dockerContext: ./web
    dockerfilePath: web/Dockerfile
    ports:
      - port: 80
        type: HTTP
    env:
      - key: VITE_API_BASE_URL
        value: http://localhost
    healthCheck:
      http:
        path: /
        port: 80
    resources:
      cpu: 0.5
      memory: 512

  # 后端服务
  - type: web
    name: api
    runtime: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    ports:
      - port: 3000
        type: HTTP
    domainMappings:
      - domain: lmrouter-gires.zeabur.app
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    healthCheck:
      http:
        path: /
        port: 3000
    resources:
      cpu: 1
      memory: 1024
