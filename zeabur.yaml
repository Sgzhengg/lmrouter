# LMRouter API Service
name: lmrouter-api

# 服务配置
services:
  - type: web
    name: api
    runtime: node
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start config/config.prod.yaml
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # 可选：配置真实的 API 密钥
      # - key: OPENAI_API_KEY
      #   value: sk-your-openai-key
      # - key: ANTHROPIC_API_KEY
      #   value: sk-ant-your-anthropic-key
    # 端口配置
    ports:
      - port: 3000
        type: HTTP
    # 健康检查
    healthCheck:
      http:
        path: /
        port: 3000
    # 资源限制
    resources:
      cpu: 1
      memory: 1024
