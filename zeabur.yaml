# Zeabur 部署配置
# 注意：Zeabur 不支持 dockerContext，所有服务都从根目录构建

services:
  # 前端服务 - 使用 Dockerfile.frontend（从根目录构建 web 目录）
  - type: web
    name: frontend
    runtime: docker
    dockerfilePath: Dockerfile.frontend
    ports:
      - port: 80
        type: HTTP
    env:
      - key: VITE_API_BASE_URL
        value: http://localhost
    healthCheck:
      http:
        path: /
        port: 80
    resources:
      cpu: 0.5
      memory: 512

  # 后端服务 - 使用根目录的 Dockerfile
  - type: web
    name: api
    runtime: docker
    dockerfilePath: Dockerfile
    ports:
      - port: 3000
        type: HTTP
    domainMappings:
      - domain: lmrouter-gires.zeabur.app
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    healthCheck:
      http:
        path: /
        port: 3000
    resources:
      cpu: 1
      memory: 1024
