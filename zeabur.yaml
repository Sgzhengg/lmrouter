# LMRouter API Service
name: lmrouter-api

# 服务配置
services:
  - type: web
    name: api
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    ports:
      - port: 3000
        type: HTTP
    # 域名配置 - 绑定公开域名以便前端可以访问
    domainMappings:
      - domain: lmrouter-gires.zeabur.app
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # 可选：配置真实的 API 密钥
      # - key: OPENAI_API_KEY
      #   value: sk-your-openai-key
      # - key: ANTHROPIC_API_KEY
      #   value: sk-ant-your-anthropic-key
    # 健康检查
    healthCheck:
      http:
        path: /
        port: 3000
    # 资源限制
    resources:
      cpu: 1
      memory: 1024
