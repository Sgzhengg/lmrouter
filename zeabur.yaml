# LMRouter API Service
name: lmrouter-api

# 服务配置
services:
  - type: web
    name: api
    runtime: node
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    # 端口配置
    ports:
      - port: 3000
        type: HTTP
    # 健康检查
    healthCheck:
      http:
        path: /
        port: 3000
    # 资源限制
    resources:
      cpu: 1
      memory: 1024
    # 挂载配置文件
    mounts:
      - dir: /app/config
        type: volume
